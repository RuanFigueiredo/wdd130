<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sobre nós do Rafting onde existe visão da empresa e o que a empresa é.">
    <meta name="author" content="Ruan Thiago Silva de Figueiredo">
    <link rel="stylesheet" href="estilos/rafting.css">
    <title>Sobre Nós - Rio Abaixo</title>
</head>

<body>
    <header>
        <img src="imagens/rio-abaixo-rafting.png" alt="logotipo">
        <nav>
            <ul class="navegacao">
                <a href="index.html">Página Inicial</a>
                <a href="sobre.html"> Sobre Nós</a>
                <a href="passeios.html">Passeios</a>
                <a href="contato.html">Fale Conosco</a>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contato-informacoes">
            <h2>Rafting Grande Florianópolis</h2>
            <h3>123 rua principal do rio</h3>
            <h3>+55 47 99999-9999</h3>
            <h3>Florianopolis, Santa Catarina</h3>
            <h3>info@correiras.com</h3>
        </section>
        <section class="contato-principal">
            <div class="mapa">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14466379.535967335!2d-67.26805854999996!3d-27.722505599999987!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9520c968a3831475%3A0xd976a3f880af8612!2sApuama%20Rafting%20Grande%20Florian%C3%B3polis!5e0!3m2!1spt-BR!2sbr!4v1781568206558!5m2!1spt-BR!2sbr"
                    width="600" height="450" " allowfullscreen="" loading=" lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <div class="formulario">
                <form action="">
                    <label for="nome">Nome:</label>
                    <input type="text" name="nome" id="nome">

                    <label for="email">E-mail:</label>
                    <input type="email" name="email" id="email">

                    <p>Escolha as opções abaixo:</p>

                    <input type="radio" name="consulta-geral" id="consulta-geral">
                    <label for="consulta-geral">Consulta Geral</label>

                    <input type="radio" name="reserva" id="reserva">
                    <label for="reserva">Pergunta sobre Reserva</label>

                    <input type="radio" name="sugestao" id="sugestao">
                    <label for="sugestao">Sugestão de site</label>

                    <label for="mensagem">Mensagem:</label>
                    <textarea name="mensagem" id="mensagem" rows="5"></textarea>

                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">
                        Quero receber a newsletter mensal
                    </label>

                    <button type="submit">Enviar Mensagem</button>


                </form>
            </div>
        </section>
        <section class="funcionarios">
            <h2>Estamos Aqui para Servi-lo</h2>

            <figure>
                <img src="" alt="">
                <figcaption>Perfil do funcionário 1</figcaption>
            </figure>
            <figure>
                <img src="" alt="">
                <figcaption>Perfil do funcionário 2</figcaption>
            </figure>
            <figure>
                <img src="" alt="">
                <figcaption>Perfil do funcionário 3</figcaption>
            </figure>
        </section>

            <a href="https://instagram.com">

            </a>
        </nav>
    </footer>
